services:
  postgres:
    image: postgres:16-alpine
    container_name: productos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ${DOCKERHUB_USER}/productos-springboot:latest
    container_name: productos-springboot
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Descomenta en una EC2 de 1 GB si el contenedor muere con codigo 137:
      # JAVA_TOOL_OPTIONS: "-Xmx300m"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
